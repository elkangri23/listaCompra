# listaCompra backend — validación + despliegue automático
# Copiar a: elkangri23/listaCompra/.github/workflows/deploy.yml
# Se dispara con cada push a main. Primero valida; solo si todo lo
# obligatorio pasa, entra por SSH al VPS y redespliega SOLO el servicio api.
# Si algo falla, la versión en vivo sigue corriendo.
#
# Gate obligatorio (falla = no se despliega):
#   npm ci, tsc --noEmit, prisma validate, tests, build de la imagen Docker.
# Opción A (elegida por Antonio 2026-11-26): tests obligatorios con servicios
# reales. La suite tiene 1.255 tests: 1.209 en verde y 34 que solo fallan
# por falta de infraestructura (33 PostgreSQL, 1 rate limiting flaky sin
# Redis), así que el job validate levanta postgres:16 y redis:7, aplica las
# migraciones y luego corre los tests contra ellos.
# En modo informe (no bloquea, de momento):
#   lint. Quitar el continue-on-error cuando se confirme la config.
# Migraciones: el contenedor api ejecuta `prisma migrate deploy` al
# arrancar (igual que en el despliegue manual). Es la única parte sin
# vuelta atrás fácil: si la migración falla, el contenedor no arranca
# y el anterior ya se ha parado. Hacer copia de la BD antes si el cambio
# toca el esquema (ver README-CICD.md).
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: listacompra-backend-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lista_user
          POSTGRES_PASSWORD: lista_password
          POSTGRES_DB: lista_compra_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lista_user:lista_password@localhost:5432/lista_compra_test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-para-ci-minimo-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Tests (obligatorio, opción A)
        run: npm test -- --ci
      - name: Lint (informe; no bloquea hasta confirmar la config)
        run: npx eslint .
        continue-on-error: true
      - name: Build de la imagen Docker
        run: docker build -t listacompra-api:ci .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar api en el VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: deploy api
